# Default values for misp.
# Quality baseline: MaximeWewer/intelowl-helm. Operator-first deps:
# MariaDB via mariadb-operator (MariaDB CRD), Redis via CloudPirates chart.

nameOverride: ""
fullnameOverride: ""

image:
  registry: ""
  pullPolicy: Always
imagePullSecrets: []

## misp-core: php-fpm + workers + cron (supervisor). Since MISP v2.5.x the web server
## was split OUT of this image into a separate misp-nginx (see `nginx` below); core no
## longer serves 80/443. It listens FastCGI on fastcgiPort and the php-fpm status pool
## on statusPort (metrics only).
core:
  image:
    repository: ghcr.io/misp/misp-docker/misp-core
    tag: "v2.5.48"
    digest: ""
  replicas: 1
  # FastCGI port php-fpm listens on; misp-nginx forwards here (FASTCGI_LISTEN).
  fastcgiPort: 9002
  # php-fpm status pool port (path /fpm-status); only opened when metrics are enabled.
  statusPort: 9003
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}

## misp-nginx: web frontend. Terminates HTTP/HTTPS and forwards to misp-core over
## FastCGI (misp-core:fastcgiPort). Separate image since nginx was split out of core;
## it ships MISP's static webroot itself, so no volume is shared with core. Stateless.
nginx:
  image:
    repository: ghcr.io/misp/misp-docker/misp-nginx
    # Empty -> Chart.AppVersion. Keep in lockstep with core.image.tag (static assets
    # are baked per version and must match the running MISP).
    tag: ""
    digest: ""
  replicas: 1
  service:
    type: ClusterIP
    httpPort: 80
    httpsPort: 443
  ## TLS at the nginx frontend. The image NEVER self-signs and refuses to start when
  ## BASE_URL is https:// without a cert present, so the chart supplies one:
  ##   existingSecret set -> mount that kubernetes.io/tls Secret (cert-manager, etc.)
  ##   else autoGenerate  -> an init container (openssl) writes a self-signed cert.
  ## Set enabled=false ONLY with an http:// baseUrl (TLS terminated entirely upstream).
  tls:
    enabled: true
    autoGenerate: true
    # kubernetes.io/tls Secret (keys tls.crt / tls.key). Takes precedence over autoGenerate.
    existingSecret: ""
  # Trust X-Forwarded-For from these CIDRs (ingress/LB) so MISP logs the real client IP.
  setRealIpFrom: []
  clientMaxBodySize: "50M"
  xFrameOptions: "SAMEORIGIN"
  # Optional hardening headers (empty = not emitted).
  contentSecurityPolicy: ""
  hstsMaxAge: ""
  extraEnv: []
  resources: {}
  nodeSelector: {}
  # nginx runs as uid 101 and binds only high ports (8080/8443/8081) -> no caps needed.
  securityContext:
    allowPrivilegeEscalation: false
    privileged: false
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    capabilities:
      drop:
        - ALL

## misp-modules: enrichment/import/export modules (port 6666).
modules:
  enabled: true
  # Service name. The misp-core image defaults the enrichment URL to
  # http://misp-modules:6666, so keep this as "misp-modules" unless you also
  # override the MISP Plugin.*_services_url settings.
  serviceName: "misp-modules"
  image:
    repository: ghcr.io/misp/misp-docker/misp-modules
    tag: "v3.0.10"
    digest: ""
  replicas: 1
  port: 6666
  resources: {}
  nodeSelector: {}

## mail: SMTP relay (egos-tech/smtp). Disable and use config.extraEnv SMTP_FQDN to
## point at an external relay in production.
mail:
  enabled: true
  image:
    repository: ghcr.io/egos-tech/smtp
    tag: "1.1.3"
    digest: ""
  # Relay config (SES_*/SMARTHOST_*). Sensitive values: prefer a Secret via env valueFrom.
  extraEnv: []
  resources: {}
  nodeSelector: {}

## misp-guard: filtering proxy for MISP sync (port 8888). Optional.
guard:
  enabled: true
  image:
    repository: ghcr.io/misp/misp-docker/misp-guard
    tag: "v1.2"
    digest: ""
  port: 8888
  args: ""
  # misp-guard REQUIRES a filtering ruleset at /config.json. This is a minimal
  # VALID-JSON skeleton — replace with your real sync-filtering rules (see
  # https://github.com/MISP/misp-docker/blob/master/guard/config.json) or guard
  # will not filter meaningfully. guard is isolated; a bad config won't affect core.
  config: |
    {
      "allowlist": { "domains": [], "urls": [] },
      "compartments_rules": { "can_reach": {} },
      "instances": {}
    }
  resources: {}
  nodeSelector: {}

## MISP application config.
config:
  # Existing Secret with keys: mysql-root-password, mysql-password, admin-password,
  # admin-key, gpg-passphrase, encryption-key, salt. If empty, the chart generates them.
  existingSecret: ""
  # Inline secrets. Manage values directly here when you have no secret manager.
  # Per-key resolution: inline value below > existing in-cluster Secret (lookup) >
  # generated random. RECOMMENDED with ArgoCD: its `lookup` is unreliable during
  # diff/sync, so an unset key re-rolls to a NEW random each sync and breaks the DB
  # and admin login. Setting these inline makes them deterministic and stable.
  # Leave a key empty to keep the lookup+random behaviour for that key.
  secrets:
    mysqlRootPassword: ""
    mysqlPassword: ""
    adminPassword: ""
    adminKey: ""
    gpgPassphrase: ""
    encryptionKey: ""
    salt: ""
  # Public URL MISP is served on (REQUIRED). e.g. https://misp.example.com
  baseUrl: ""
  timezone: "UTC"
  # Apply DB schema updates on boot. REQUIRED on first install: the image's base
  # schema lags the app, so tables like `bookmarks` are created by these updates.
  # Without it, authenticated endpoints 500 with MissingTableException until you
  # run `cake Admin runUpdates` manually.
  enableBackgroundUpdates: true
  # Initial site admin (created on first boot).
  adminEmail: "admin@admin.test"
  adminOrg: "ORGNAME"
  # Init container (nc) waiting for DB + Redis before misp-core starts.
  initImage: "busybox:1.36"
  # Extra env appended to misp-core (OIDC_*, LDAP*, AAD_*, PROXY_*, S3_*, SYNCSERVERS_*,
  # PHP_*, NGINX_*). See https://github.com/MISP/misp-docker template.env
  extraEnv: []
  # envFrom (Secrets/ConfigMaps) for the above when sourced from a Secret.
  extraEnvFrom: []

## Persistent data for misp-core (RWO; single core replica). Mounted via subPaths:
## Config, files (attachments), .gnupg, tmp/logs. Seeded from image defaults on first
## start by an init container (mounting a PVC hides the image's shipped defaults).
persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  size: 10Gi
  accessModes:
    - ReadWriteOnce

## MariaDB via mariadb-operator (the operator + CRDs must be installed first).
mariadb:
  enabled: true
  username: misp
  database: misp
  image: "mariadb:10.11"
  storage:
    size: 10Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 300m
      memory: 512Mi
    limits:
      memory: 2Gi
  # InnoDB tuning (mirrors the upstream misp-docker compose).
  myCnf: |
    [mariadb]
    bind-address=*
    default_storage_engine=InnoDB
    innodb_buffer_pool_size=2048M
    innodb_change_buffering=none
    innodb_io_capacity=1000
    innodb_io_capacity_max=2000
    innodb_log_file_size=600M
    innodb_read_io_threads=16
    innodb_write_io_threads=4
    max_allowed_packet=256M

## Redis (CloudPirates subchart). MISP supports Redis auth, so it is ENABLED;
## the subchart generates a password in the <release>-redis Secret (key redis-password),
## which misp-core reads as REDIS_PASSWORD.
redis:
  enabled: true
  auth:
    enabled: true
  persistence:
    enabled: true
    size: 2Gi
  # redis_exporter sidecar shipped by the subchart. NOT gated on metrics.enabled —
  # Helm cannot template subchart values, so enable it here explicitly.
  metrics:
    enabled: false
    serviceMonitor:
      enabled: false
      # Must match your Prometheus serviceMonitorSelector (e.g. release: kps).
      selector: {}
      interval: 30s

## Prometheus metrics.
##
## Upstream MISP exposes NO Prometheus endpoint of its own (misp-core, misp-modules,
## misp-guard and the SMTP relay ship no /metrics). What IS scrapeable:
##   - misp-core  : php-fpm pool stats, via a php-fpm_exporter sidecar (below)
##   - misp-nginx : nginx stub_status, via a nginx-prometheus-exporter sidecar (below)
##   - mariadb    : mysqld-exporter, run by mariadb-operator (spec.metrics)
##   - redis      : redis_exporter, run by the CloudPirates subchart (redis.metrics)
## Application-level MISP metrics (event/feed/user counts) only exist as an out-of-tree
## API poller writing node_exporter textfiles (Truesec/misp-metricsexporter) — not an
## HTTP endpoint, so it is not wired here.
metrics:
  # Master switch for the exporters this chart owns (core + nginx sidecars, MariaDB CR).
  # Redis is a subchart: its switch cannot be templated, set redis.metrics.* directly.
  enabled: false

  ## misp-core: php-fpm pool metrics.
  ## A non-empty FASTCGI_LISTEN_STATUS makes the entrypoint set pm.status_path=/fpm-status;
  ## with PHP_LISTEN_FPM (always on now) the status pool listens on TCP :statusPort, which
  ## the sidecar scrapes directly over FastCGI (tcp://127.0.0.1:<statusPort>/fpm-status).
  core:
    enabled: true
    image:
      repository: hipages/php-fpm_exporter
      tag: "2.2.0"
      digest: ""
    # Port the sidecar serves /metrics on.
    port: 9253
    resources: {}
    securityContext:
      allowPrivilegeEscalation: false
      privileged: false
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      capabilities:
        drop:
          - ALL

  ## misp-nginx: stub_status metrics. The image already serves stub_status on
  ## 127.0.0.1:8081/status; the sidecar scrapes it and exposes /metrics.
  nginx:
    enabled: true
    image:
      repository: nginx/nginx-prometheus-exporter
      tag: "1.4.2"
      digest: ""
    # Port the sidecar serves /metrics on.
    port: 9113
    # nginx image's internal stub_status port (NGINX_INTERNAL_STATUS_PORT).
    statusPort: 8081
    resources: {}
    securityContext:
      allowPrivilegeEscalation: false
      privileged: false
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      capabilities:
        drop:
          - ALL

  ## MariaDB: mysqld-exporter, deployed by mariadb-operator from the MariaDB CR.
  ## The operator provisions the monitoring user and its Secret by itself, and creates
  ## the ServiceMonitor (this chart does not).
  mariadb:
    enabled: true
    # Leave empty to let the operator pick its default mysqld-exporter image.
    image: ""
    port: 9104
    resources: {}

  ## NetworkPolicy peers allowed to scrape the chart's exporter ports (core + nginx).
  ## Empty = any pod in any namespace (exporter ports only). Only used when
  ## networkPolicy.enabled.
  allowedFrom: []

  ## ServiceMonitor (prometheus-operator) for the chart-owned exporters.
  serviceMonitor:
    enabled: false
    # Namespace to create the ServiceMonitor in. Empty = release namespace.
    namespace: ""
    interval: 30s
    scrapeTimeout: ""
    # kube-prometheus-stack only picks up ServiceMonitors carrying its release label,
    # e.g. `release: kube-prometheus-stack`.
    labels: {}
    annotations: {}
    honorLabels: false
    relabelings: []
    metricRelabelings: []
    # Passed to the MariaDB CR; the operator stamps it as the `release` label on the
    # ServiceMonitor it creates. Defaults to the value found in serviceMonitor.labels.
    prometheusRelease: ""

## Point MISP at an external Redis instead of the subchart (sets redis.enabled=false).
externalRedis:
  host: ""
  port: 6379
  existingSecret: ""
  existingSecretPasswordKey: "redis-password"

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

## Pod-level security context. Applies to misp-core AND misp-nginx pods; the nginx
## container overrides runAsNonRoot/runAsUser via nginx.securityContext.
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
  # misp-core runs php-fpm + cron as root (supervisor); enable after verifying uids.
  runAsNonRoot: false

## Container hardening for misp-core (php-fpm/cron, root via supervisor). Conservative
## drop set rather than ALL to avoid breaking the supervisor stack. (misp-nginx has its
## own hardened context under nginx.securityContext.)
containerSecurityContext:
  allowPrivilegeEscalation: false
  privileged: false
  capabilities:
    drop:
      - ALL
    add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - AUDIT_WRITE
      # entrypoint chmods seeded files (tmp/files) owned by www-data while running
      # as root; without FOWNER chmod-on-unowned fails with "Operation not permitted".
      - FOWNER

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: misp.example.com
  tls: []

networkPolicy:
  enabled: true
  coreAllowedFrom: []
  extraEgress: []

podDisruptionBudget:
  enabled: false
  minAvailable: ""
  maxUnavailable: ""
