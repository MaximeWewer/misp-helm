{{- if .Values.bootstrap.enabled }}
{{- /*
Declarative MISP configuration (feeds, taxonomies, warning/notice lists, server
settings, organisations) reconciled through the REST API by files/bootstrap.py.

The Job is a normal resource (not a hook) whose name carries a hash of its
config, script and pod template. `Job.spec.template` is immutable, so a changed
config yields a NEW Job (re-run), while an unchanged one re-uses the completed
Job. Works the same under Helm and Argo CD (where .Release.Revision stays 1).
The script is idempotent: a re-run only writes differences.
*/ -}}
{{- $b := .Values.bootstrap -}}
{{- $cfg := dict
      "feeds" $b.feeds
      "taxonomies" $b.taxonomies
      "taxonomiesAddTags" $b.taxonomiesAddTags
      "disableOtherTaxonomies" $b.disableOtherTaxonomies
      "warninglists" $b.warninglists
      "updateWarninglists" $b.updateWarninglists
      "noticelists" $b.noticelists
      "updateNoticelists" $b.updateNoticelists
      "updateGalaxies" $b.updateGalaxies
      "serverSettings" $b.serverSettings
      "organisations" $b.organisations
      "fetchOnSync" $b.fetchOnSync -}}
{{- $cfgJson := toPrettyJson $cfg -}}
{{- $script := .Files.Get "files/bootstrap.py" -}}
{{- $hash := printf "%s\n%s\n%s\n%s" $cfgJson $script (include "misp.bootstrap.url" .) (toYaml (dict "image" $b.image "resources" $b.resources "verify" $b.verifyTls "wait" $b.waitTimeoutSeconds "secret" (include "misp.secretName" .))) | sha256sum | trunc 10 -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-bootstrap" (include "misp.fullname" .) }}
  labels:
    app.kubernetes.io/component: bootstrap
    {{- include "misp.labels" . | nindent 4 }}
data:
  config.json: |
    {{- $cfgJson | nindent 4 }}
  bootstrap.py: |
    {{- $script | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-bootstrap-%s" (include "misp.fullname" .) $hash | trunc 63 | trimSuffix "-" }}
  labels:
    app.kubernetes.io/component: bootstrap
    {{- include "misp.labels" . | nindent 4 }}
spec:
  backoffLimit: {{ $b.backoffLimit }}
  {{- if not (kindIs "invalid" $b.ttlSecondsAfterFinished) }}
  ttlSecondsAfterFinished: {{ $b.ttlSecondsAfterFinished }}
  {{- end }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: bootstrap
        {{- include "misp.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/bootstrap: {{ $hash }}
    spec:
      restartPolicy: OnFailure
      {{- include "misp.bootstrap.podSpec" (dict "root" . "mode" "sync") | nindent 6 }}
{{- if $b.feedsSchedule }}
---
# Periodic feed fetch + cache (MISP scheduled tasks are otherwise set in the UI).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ printf "%s-feeds-fetch" (include "misp.fullname" .) | trunc 52 | trimSuffix "-" }}
  labels:
    app.kubernetes.io/component: bootstrap
    {{- include "misp.labels" . | nindent 4 }}
spec:
  schedule: {{ $b.feedsSchedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/component: bootstrap
            {{- include "misp.selectorLabels" . | nindent 12 }}
        spec:
          restartPolicy: OnFailure
          {{- include "misp.bootstrap.podSpec" (dict "root" . "mode" "fetch") | nindent 10 }}
{{- end }}
{{- end }}
