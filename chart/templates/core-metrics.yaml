{{- if .Values.metrics.enabled }}
{{- $sm := .Values.metrics.serviceMonitor }}
{{- /* Dedicated ClusterIP Services so exporters are never published through the
       web/service types alongside the app. One (Service [+ ServiceMonitor]) per
       chart-owned exporter: misp-core (php-fpm) and misp-nginx (stub_status). */}}
{{- range $e := list
      (dict "key" "core"  "enabled" .Values.metrics.core.enabled  "component" "core"  "port" .Values.metrics.core.port  "name" (printf "%s-metrics" (include "misp.core.fullname" .)))
      (dict "key" "nginx" "enabled" .Values.metrics.nginx.enabled "component" "nginx" "port" .Values.metrics.nginx.port "name" (printf "%s-metrics" (include "misp.nginx.fullname" .))) }}
{{- if $e.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $e.name }}
  labels:
    app.kubernetes.io/component: {{ $e.component }}-metrics
    {{- include "misp.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ $e.port }}
      targetPort: metrics
      protocol: TCP
  selector:
    app.kubernetes.io/component: {{ $e.component }}
    {{- include "misp.selectorLabels" $ | nindent 4 }}
{{- if $sm.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $e.name }}
  namespace: {{ $sm.namespace | default $.Release.Namespace }}
  labels:
    app.kubernetes.io/component: {{ $e.component }}-metrics
    {{- include "misp.labels" $ | nindent 4 }}
    {{- with $sm.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $sm.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ $.Release.Namespace }}
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ $e.component }}-metrics
      {{- include "misp.selectorLabels" $ | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ $sm.interval }}
      {{- with $sm.scrapeTimeout }}
      scrapeTimeout: {{ . }}
      {{- end }}
      honorLabels: {{ $sm.honorLabels }}
      {{- with $sm.relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $sm.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
