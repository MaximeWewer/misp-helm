{{- if .Values.ingress.enabled }}
{{- /*
Backend is the misp-nginx frontend. With nginx.tls.enabled the backend speaks HTTPS
(self-signed), so the ingress controller must re-encrypt: set the backend-protocol
annotation (nginx: nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"; traefik:
a serverstransport, etc.) under ingress.annotations.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "misp.nginx.fullname" . }}
  labels:
    app.kubernetes.io/component: nginx
    {{- include "misp.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "misp.nginx.fullname" . }}
                port:
                  number: {{ if .Values.nginx.tls.enabled }}{{ .Values.nginx.service.httpsPort }}{{ else }}{{ .Values.nginx.service.httpPort }}{{ end }}
{{- end }}
