apiVersion: v1
kind: Service
metadata:
  name: {{ include "misp.nginx.fullname" . }}
  labels:
    app.kubernetes.io/component: nginx
    {{- include "misp.labels" . | nindent 4 }}
  {{- with .Values.nginx.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.nginx.service.type }}
  ports:
    - name: http
      port: {{ .Values.nginx.service.httpPort }}
      targetPort: http
      protocol: TCP
    {{- if .Values.nginx.tls.enabled }}
    - name: https
      port: {{ .Values.nginx.service.httpsPort }}
      targetPort: https
      protocol: TCP
    {{- end }}
  selector:
    app.kubernetes.io/component: nginx
    {{- include "misp.selectorLabels" . | nindent 4 }}
