{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "misp.fullname" . }}
  labels:
    {{- include "misp.labels" . | nindent 4 }}
spec:
  # Applies to MISP app pods (mariadb operator / redis subchart manage their own).
  podSelector:
    matchLabels:
      {{- include "misp.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Web UI/API reaches the misp-nginx frontend (8080/8443) from declared sources
    # (e.g. the ingress controller).
    {{- with .Values.networkPolicy.coreAllowedFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8443
    {{- end }}
    # Intra-app: nginx -> core FastCGI (9002{{ if and .Values.metrics.enabled .Values.metrics.core.enabled }}/9003{{ end }}); core -> modules ({{ .Values.modules.port }}); -> mail (25){{ if .Values.guard.enabled }}; sync -> guard ({{ .Values.guard.port }}){{ end }}.
    - from:
        - podSelector:
            matchLabels:
              {{- include "misp.selectorLabels" . | nindent 14 }}
      ports:
        {{- if .Values.modules.enabled }}
        - protocol: TCP
          port: {{ .Values.modules.port }}
        {{- end }}
        - protocol: TCP
          port: {{ .Values.core.fastcgiPort }}
        {{- if and .Values.metrics.enabled .Values.metrics.core.enabled }}
        - protocol: TCP
          port: {{ .Values.core.statusPort }}
        {{- end }}
        - protocol: TCP
          port: 25
    {{- if .Values.metrics.enabled }}
    # Prometheus -> chart exporters (core + nginx sidecars). Empty allowedFrom = any
    # pod/namespace, but on the exporter ports only.
    - from:
        {{- with .Values.metrics.allowedFrom }}
        {{- toYaml . | nindent 8 }}
        {{- else }}
        - namespaceSelector: {}
        {{- end }}
      ports:
        {{- if .Values.metrics.core.enabled }}
        - protocol: TCP
          port: {{ .Values.metrics.core.port }}
        {{- end }}
        {{- if .Values.metrics.nginx.enabled }}
        - protocol: TCP
          port: {{ .Values.metrics.nginx.port }}
        {{- end }}
    {{- end }}
  egress:
    # DNS
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # In-namespace deps (mariadb 3306, redis 6379, modules, mail).
    - to:
        - podSelector: {}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
